{% extends "base_public.html" %}
{% block title %}Staff log in — Longleaf{% endblock %}
{% block content %}
<div class="formcard" style="max-width:400px">
  <h2>Staff log in</h2>
  {% if form.errors %}<p class="errorlist">Username and password didn't match — try again.</p>{% endif %}
  <form method="post">{% csrf_token %}
    <div class="field"><label for="id_username">Username</label>{{ form.username }}</div>
    <div class="field"><label for="id_password">Password</label>{{ form.password }}</div>
    <button class="btn" type="submit">Log in</button>
  </form>
</div>
{% endblock %}
