<div id="tag-editor">
  {% for tag in all_tags %}
    {% if tag in household.tags.all %}
      <button class="tagchip {% if tag.category == 'environment' %}env{% endif %}" title="Click to remove"
        hx-post="{% url 'toggle_tag' household.pk tag.pk %}" hx-target="#tag-editor" hx-swap="outerHTML">✓ {{ tag.name }}</button>
    {% else %}
      <button class="tagchip ghost" title="Click to add"
        hx-post="{% url 'toggle_tag' household.pk tag.pk %}" hx-target="#tag-editor" hx-swap="outerHTML">+ {{ tag.name }}</button>
    {% endif %}
  {% endfor %}
</div>
